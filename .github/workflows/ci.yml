name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[pdf]"
      - run: python -m unittest discover -s tests -v
      - run: python -m powersemiforge device list
      - run: python -m powersemiforge simulate --matrix examples/batch_matrix.yaml --output artifacts/ci-run
      - run: python -m powersemiforge report --input artifacts/ci-run/results.csv --output artifacts/ci-report

